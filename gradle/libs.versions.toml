[versions]
# SDK & Build Tools (Target Platform Android Modern)
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

agp = "8.9.0"
kotlin = "2.0.21"
parcelize = "1.9.10"
ksp = "2.0.21-1.0.28"

coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.0"
constraintlayout = "2.2.0"
ads = "23.6.0"
androidx-lifecycle = "2.8.7"
recycler = "1.4.0"
paging = "3.3.5"
lotte = "5.2.0"
guava = "33.3.1-android"

#Glide
glide = "4.16.0"

#Room
room = "2.6.0-rc01"

hiltVersion = "2.46.1"

# Firebase & Google Services
firebaseBom = "33.1.1"
androidx-navigation = "2.7.2"
googleGmsGoogleServices = "4.4.2"
playServicesAuth = "21.3.0"
firebaseAuth = "23.1.0"
firebaseDatabase = "21.0.0"
firebaseFirestoreKtx = "25.1.1"
firestoreUi = "8.0.0"
billingKtx = "8.0.0"
googleAppGoogleServices = "2.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recycler" }
androidx-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "ads" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

#Paging
paging = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }

#Android X lifecycle
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewModel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android" ,version.ref = "hiltVersion"}
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler" ,version.ref = "hiltVersion"}

#Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

#navigation
navigation-fragmen = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }
lotte = { group = "com.airbnb.android", name = "lottie", version.ref = "lotte" }
firebase-database = { group = "com.google.firebase", name = "firebase-database", version.ref = "firebaseDatabase" }
google-play-service-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
google-play-service-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesAuth" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx", version.ref = "firebaseFirestoreKtx" }
firebase-firestore-ui = {group = "com.firebaseui", name = "firebase-ui-firestore", version.ref = "firestoreUi" }
#app-purchase
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billingKtx" }
#app-update
app-update = { group = "com.google.android.play", name = "app-update", version.ref = "googleAppGoogleServices" }
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "googleAppGoogleServices" }
#desugar = { group = "com.android.tools", name = "desugar_jdk_libs", version = "2.1.4" }
r8 = { group = "com.android.tools", name = "r8", version = "8.7.18" }

[bundles]
proguard =[
    "r8"
]
appudapte = [
    "app-update",
    "app-update-ktx",
]
firebase = [
    "firebase-auth",
    "firebase-database",
    "firebase-firestore-ktx",
    "firebase-firestore-ui"
]
lifecycle = [
    "androidx-lifecycle-compose",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewModel",
    "androidx-lifecycle-viewModel-compose",
]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
    "androidx-room-paging"
]
paging = [
    "paging",
    "paging-common",
]

navigation = [
    "navigation-fragmen",
    "navigation-ui",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref ="hiltVersion" }
#org-jetbrains-kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }